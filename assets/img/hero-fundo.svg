<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4d9d9" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#f7e2e1" stop-opacity=".7"/>
      <stop offset="1" stop-color="#efd0d1" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9c3c8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#dfb2ba" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#edd0d1" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#f1d8d8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f9e8e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="soft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f6dddd" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f9e8e6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- manchas suaves à esquerda, atrás do título -->
  <ellipse cx="260" cy="130" rx="380" ry="190" fill="url(#soft)"/>
  <ellipse cx="120" cy="470" rx="320" ry="170" fill="url(#soft)"/>

  <!-- ondas orgânicas inferiores -->
  <path d="M0 455 C 220 395 430 500 710 455 C 960 415 1170 335 1440 370 L1440 620 L0 620 Z" fill="url(#waveA)"/>
  <path d="M0 525 C 260 480 490 575 770 538 C 1010 505 1210 455 1440 485 L1440 620 L0 620 Z" fill="url(#waveB)"/>

  <!-- linhas finas em malva (como no mockup) -->
  <path d="M-20 585 C 300 400 580 540 910 330 C 1110 205 1300 225 1470 130" fill="none" stroke="#b98a91" stroke-width="1.4" opacity=".5"/>
  <path d="M-20 615 C 320 440 600 575 930 372 C 1130 250 1310 268 1470 178" fill="none" stroke="#b98a91" stroke-width="1" opacity=".28"/>
</svg>
